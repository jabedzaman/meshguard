x-go-volumes: &go-volumes
  volumes:
    - ./go.work:/app/go.work
    - ./internal:/app/internal
    - ./apps/agent:/app/apps/agent
    - ./apps/cli:/app/apps/cli
    - ./apps/relay:/app/apps/relay
    - go_mod_cache:/go/pkg/mod
    - go_build_cache:/root/.cache/go-build

services:
  api:
    container_name: meshguard-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://meshguard:meshguard@postgres:5432/meshguard
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      # The relay URL agents get. Set RELAY_PUBLIC_URL in .env when agents on
      # other machines need it (e.g. ws://<this machine's LAN/tailnet IP>:3340/relay).
      - RELAY_URL=${RELAY_PUBLIC_URL:-ws://localhost:3340/relay}
      # Agents ask these for their public address (hole punching).
      - STUN_SERVERS=${STUN_SERVERS:-stun.l.google.com:19302,stun.cloudflare.com:3478}
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/auth/dist:/app/packages/auth/dist
      - ./packages/config/dist:/app/packages/config/dist
      - ./packages/db/dist:/app/packages/db/dist
      - ./packages/emails/dist:/app/packages/emails/dist
      - ./packages/server-core/dist:/app/packages/server-core/dist
      - ./packages/utils/dist:/app/packages/utils/dist

  workers:
    container_name: meshguard-workers
    build:
      context: .
      dockerfile: apps/workers/Dockerfile.dev
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - SMTP_URL=smtp://mailpit:1025
      - NATS_URL=nats://nats:4222
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
    depends_on:
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      nats:
        condition: service_started
    volumes:
      - ./apps/workers/src:/app/apps/workers/src
      - ./packages/config/dist:/app/packages/config/dist
      - ./packages/db/dist:/app/packages/db/dist
      - ./packages/emails/dist:/app/packages/emails/dist
      - ./packages/server-core/dist:/app/packages/server-core/dist
      - ./packages/utils/dist:/app/packages/utils/dist

  web:
    container_name: meshguard-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://meshguard:meshguard@postgres:5432/meshguard
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages/ui/src:/app/packages/ui/src
      - ./packages/api-client/dist:/app/packages/api-client/dist
      - ./packages/auth/dist:/app/packages/auth/dist
      - ./packages/config/dist:/app/packages/config/dist
      - ./packages/db/dist:/app/packages/db/dist

  www:
    container_name: meshguard-www
    build:
      context: .
      dockerfile: apps/www/Dockerfile.dev
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
    ports:
      - "${WWW_HOST_PORT:-3002}:3002"
    volumes:
      - ./apps/www/src:/app/apps/www/src
      - ./apps/www/public:/app/apps/www/public
      - ./packages/ui/src:/app/packages/ui/src

  relay:
    <<: *go-volumes
    container_name: meshguard-relay
    build:
      context: .
      dockerfile: apps/relay/Dockerfile.dev
    environment:
      - STUN_ADDR=:3478,:3479
      # Pair of RELAY_TOKEN_KEY (api, from .env); empty serves any agent.
      - RELAY_TRUST_KEY=${RELAY_TRUST_KEY:-}
      # Public TLS listener for funnels (":443" in production); needs RELAY_TRUST_KEY.
      - RELAY_FUNNEL_ADDR=${RELAY_FUNNEL_ADDR:-}
    ports:
      - "${RELAY_HOST_PORT:-3340}:3340"
    # Also on the lab's "internet", where lab devices reach it (relay + STUN).
    networks:
      default: {}
      lab_inet:
        ipv4_address: 10.200.0.11

  # ---------------------------------------------------------------------------
  # E2E stack (`pnpm e2e:up`): same images, separate meshguard_test database and
  # Redis db 1, so tests never touch dev data. Not started by `docker:up`.
  # ---------------------------------------------------------------------------
  api-e2e:
    profiles: [e2e]
    container_name: meshguard-api-e2e
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://meshguard:meshguard@postgres:5432/meshguard_test
      - REDIS_URL=redis://redis:6379/1
      - NATS_URL=nats://nats:4222
      - BETTER_AUTH_URL=http://localhost:4200
      - WEB_URL=http://localhost:3200
      - RELAY_URL=ws://10.200.0.11:3340/relay
      - STUN_SERVERS=10.200.0.11:3478,10.200.0.11:3479
      # HTTPS certificates for mesh names come from Pebble, a test CA that
      # reads DNS-01 answers from challtestsrv.
      # Set by `pnpm lab` (with the relay's RELAY_TRUST_KEY) so funnels can be tested.
      - RELAY_TOKEN_KEY=${LAB_RELAY_TOKEN_KEY:-${RELAY_TOKEN_KEY:-}}
      - ACME_DIRECTORY_URL=https://pebble:14000/dir
      - ACME_EMAIL=lab@e2e.test
      - ACME_DNS_PROVIDER=challtestsrv
      - CHALLTESTSRV_URL=http://challtestsrv:8055
      - ACME_INSECURE_TLS=1
      - LOG_LEVEL=warn
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
    ports:
      - "4200:4000"
    networks:
      default: {}
      lab_inet:
        ipv4_address: 10.200.0.10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/auth/dist:/app/packages/auth/dist
      - ./packages/config/dist:/app/packages/config/dist
      - ./packages/db/dist:/app/packages/db/dist
      - ./packages/emails/dist:/app/packages/emails/dist
      - ./packages/server-core/dist:/app/packages/server-core/dist
      - ./packages/utils/dist:/app/packages/utils/dist

  web-e2e:
    profiles: [e2e]
    container_name: meshguard-web-e2e
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://meshguard:meshguard@postgres:5432/meshguard_test
      - BETTER_AUTH_URL=http://localhost:4200
      - WEB_URL=http://localhost:3200
      - NEXT_PUBLIC_API_URL=http://localhost:4200
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
    ports:
      - "3200:3000"
    depends_on:
      postgres:
        condition: service_healthy
      api-e2e:
        condition: service_started
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages/ui/src:/app/packages/ui/src
      - ./packages/api-client/dist:/app/packages/api-client/dist
      - ./packages/auth/dist:/app/packages/auth/dist
      - ./packages/config/dist:/app/packages/config/dist
      - ./packages/db/dist:/app/packages/db/dist

  workers-e2e:
    profiles: [e2e]
    container_name: meshguard-workers-e2e
    build:
      context: .
      dockerfile: apps/workers/Dockerfile.dev
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/1
      - SMTP_URL=smtp://mailpit:1025
      - NATS_URL=nats://nats:4222
      - LOG_LEVEL=warn
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
    depends_on:
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      nats:
        condition: service_started
    volumes:
      - ./apps/workers/src:/app/apps/workers/src
      - ./packages/config/dist:/app/packages/config/dist
      - ./packages/db/dist:/app/packages/db/dist
      - ./packages/emails/dist:/app/packages/emails/dist
      - ./packages/server-core/dist:/app/packages/server-core/dist
      - ./packages/utils/dist:/app/packages/utils/dist

  # Pebble, Let's Encrypt's test CA, and the DNS server it validates against,
  # for the certificates tests (`meshguard cert`). Not started by `docker:up`.
  pebble:
    profiles: [e2e]
    container_name: meshguard-pebble
    image: ghcr.io/letsencrypt/pebble:latest
    command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "challtestsrv:8053"]
    environment:
      - PEBBLE_VA_NOSLEEP=1
      - PEBBLE_VA_ALWAYS_VALID=0
    ports:
      - "15000:15000" # management: GET /roots/0 is the CA certificate
    depends_on:
      - challtestsrv

  challtestsrv:
    profiles: [e2e]
    container_name: meshguard-challtestsrv
    image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
    command: ["-http01", "", "-https01", "", "-tlsalpn01", ""]

  # Browser for the tests. Host networking so it reaches the e2e stack on
  # localhost, where web and API share a site and session cookies work.
  # Keep the version in step with @playwright/test.
  playwright:
    profiles: [e2e]
    container_name: meshguard-playwright
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    network_mode: host
    init: true
    ipc: host
    command:
      ["npx", "-y", "playwright@1.63.0", "run-server", "--port", "3300", "--host", "127.0.0.1"]

  # ---------------------------------------------------------------------------
  # MeshGuard lab (`pnpm lab`), on the e2e stack. lab_inet plays the internet (API
  # .10, relay + STUN .11). lab-a/lab-b share it like a LAN. lab-e sits behind
  # a cone NAT and lab-f is directly on the internet (must go direct through
  # e's NAT). lab-g sits behind a symmetric NAT and lab-h behind a cone NAT
  # (punching can't work; must use the relay).
  # ---------------------------------------------------------------------------
  lab-a: &lab-device
    profiles: [lab]
    container_name: meshguard-lab-a
    hostname: lab-a
    build:
      context: .
      dockerfile: apps/agent/Dockerfile.lab
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    networks: [lab_inet]

  lab-b:
    <<: *lab-device
    container_name: meshguard-lab-b
    hostname: lab-b

  # Subnet router: also on lab_subnet, a LAN with a plain host (lab-s) that
  # only this device can reach (the network is internal, so Docker routes
  # nothing into it).
  lab-r:
    <<: *lab-device
    container_name: meshguard-lab-r
    hostname: lab-r
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
    networks:
      lab_inet:
      lab_subnet: { ipv4_address: 192.168.50.2 }

  # A host on the router's LAN. No agent runs here; the lab starts listeners.
  lab-s:
    <<: *lab-device
    container_name: meshguard-lab-s
    hostname: lab-s
    command: ["sleep", "infinity"]
    networks:
      lab_subnet: { ipv4_address: 192.168.50.10 }

  lab-e: &lab-natted
    <<: *lab-device
    container_name: meshguard-lab-e
    hostname: lab-e
    # Route everything through this device's NAT router.
    command: ["sh", "-c", "ip route replace default via $$GATEWAY && exec meshguard-agent"]
    environment: [GATEWAY=10.201.0.2]
    networks:
      lab_lan_e: { ipv4_address: 10.201.0.10 }

  # Reachable on the "internet" with no NAT, like a VPS.
  lab-f:
    <<: *lab-device
    container_name: meshguard-lab-f
    hostname: lab-f
    networks:
      lab_inet: { ipv4_address: 10.200.0.30 }

  lab-g:
    <<: *lab-natted
    container_name: meshguard-lab-g
    hostname: lab-g
    environment: [GATEWAY=10.203.0.2]
    networks:
      lab_lan_g: { ipv4_address: 10.203.0.10 }

  lab-h:
    <<: *lab-natted
    container_name: meshguard-lab-h
    hostname: lab-h
    environment: [GATEWAY=10.204.0.2]
    networks:
      lab_lan_h: { ipv4_address: 10.204.0.10 }

  router-e: &lab-router
    profiles: [lab]
    container_name: meshguard-router-e
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache iptables iproute2
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    # NAT the LAN out of the "internet" interface. NAT_FLAGS=--random-fully
    # makes it symmetric (new public port per destination).
    command:
      - sh
      - -c
      - |
        inet=$$(ip -o -4 addr | awk '/ 10\.200\.0\./ {print $$2}')
        iptables -t nat -A POSTROUTING -o "$$inet" -j MASQUERADE $$NAT_FLAGS
        exec sleep infinity
    environment: [NAT_FLAGS=]
    networks:
      lab_inet: { ipv4_address: 10.200.0.20 }
      lab_lan_e: { ipv4_address: 10.201.0.2 }

  router-g:
    <<: *lab-router
    container_name: meshguard-router-g
    environment: [NAT_FLAGS=--random-fully]
    networks:
      lab_inet: { ipv4_address: 10.200.0.22 }
      lab_lan_g: { ipv4_address: 10.203.0.2 }

  router-h:
    <<: *lab-router
    container_name: meshguard-router-h
    networks:
      lab_inet: { ipv4_address: 10.200.0.23 }
      lab_lan_h: { ipv4_address: 10.204.0.2 }

volumes:
  go_mod_cache:
  go_build_cache:

networks:
  lab_inet:
    ipam: { config: [{ subnet: 10.200.0.0/24 }] }
    # Docker drops traffic to a container's address arriving from another
    # bridge; the lab's NAT routers forward exactly that, so allow it here.
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
  lab_subnet:
    internal: true
    ipam: { config: [{ subnet: 192.168.50.0/24 }] }
  lab_lan_e:
    ipam: { config: [{ subnet: 10.201.0.0/24 }] }
  lab_lan_g:
    ipam: { config: [{ subnet: 10.203.0.0/24 }] }
  lab_lan_h:
    ipam: { config: [{ subnet: 10.204.0.0/24 }] }
