# Copy to secret.yaml (gitignored), fill in real values, then
# `kubectl apply -f deploy/k8s/secret.yaml`. Never commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: meshguard-secrets
  namespace: meshguard
type: Opaque
stringData:
  # POSTGRES_PASSWORD and the password in DATABASE_URL must match.
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgres://meshguard:change-me@meshguard-postgres:5432/meshguard"
  # openssl rand -hex 32
  BETTER_AUTH_SECRET: "change-me-openssl-rand-hex-32"
  # Any SMTP provider, e.g. smtp://user:pass@smtp.resend.com:587
  SMTP_URL: "smtp://user:pass@smtp.example.com:587"
  CLOUDFLARE_TUNNEL_TOKEN: "change-me"
  # Signs relay tokens; its pair is RELAY_TRUST_KEY in configmap.yaml.
  # meshguard-relay -gen-key prints both. Empty: no tokens.
  RELAY_TOKEN_KEY: ""
  # Optional, for "Sign in with GitHub".
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
