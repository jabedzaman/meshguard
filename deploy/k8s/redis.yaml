apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meshguard-redis
  labels:
    app: meshguard-redis
    app.kubernetes.io/part-of: meshguard
    app.kubernetes.io/managed-by: kustomize
spec:
  serviceName: meshguard-redis
  replicas: 1
  selector:
    matchLabels:
      app: meshguard-redis
  template:
    metadata:
      labels:
        app: meshguard-redis
        app.kubernetes.io/part-of: meshguard
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 384Mi
              cpu: 200m
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: meshguard-redis
  labels:
    app: meshguard-redis
    app.kubernetes.io/part-of: meshguard
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app: meshguard-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
