apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshguard-web
  labels:
    app: meshguard-web
    app.kubernetes.io/part-of: meshguard
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshguard-web
  template:
    metadata:
      labels:
        app: meshguard-web
        app.kubernetes.io/part-of: meshguard
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: web
          image: ghcr.io/jabedzaman/meshguard-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: meshguard-config
            - secretRef:
                name: meshguard-secrets
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: meshguard-web
  labels:
    app: meshguard-web
    app.kubernetes.io/part-of: meshguard
    app.kubernetes.io/managed-by: kustomize
spec:
  type: NodePort
  selector:
    app: meshguard-web
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
