x-go-volumes: &go-volumes
  volumes:
    - ./go.work:/app/go.work
    - ./internal:/app/internal
    - ./apps/agent:/app/apps/agent
    - ./apps/cli:/app/apps/cli
    - ./apps/relay:/app/apps/relay
    - ./apps/dns:/app/apps/dns
    - go_mod_cache:/go/pkg/mod
    - go_build_cache:/root/.cache/go-build

services:
  api:
    container_name: mesh-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://mesh:mesh@postgres:5432/mesh
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      # Agents on this machine reach the relay through the published port.
      - RELAY_URL=ws://localhost:${RELAY_HOST_PORT:-3340}/relay
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/auth/dist:/app/packages/auth/dist
      - ./packages/config/dist:/app/packages/config/dist
      - ./packages/db/dist:/app/packages/db/dist
      - ./packages/emails/dist:/app/packages/emails/dist
      - ./packages/server-core/dist:/app/packages/server-core/dist
      - ./packages/utils/dist:/app/packages/utils/dist

  workers:
    container_name: mesh-workers
    build:
      context: .
      dockerfile: apps/workers/Dockerfile.dev
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - SMTP_URL=smtp://mailpit:1025
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
    depends_on:
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - ./apps/workers/src:/app/apps/workers/src
      - ./packages/config/dist:/app/packages/config/dist
      - ./packages/db/dist:/app/packages/db/dist
      - ./packages/emails/dist:/app/packages/emails/dist
      - ./packages/server-core/dist:/app/packages/server-core/dist
      - ./packages/utils/dist:/app/packages/utils/dist

  web:
    container_name: mesh-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://mesh:mesh@postgres:5432/mesh
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages/ui/src:/app/packages/ui/src
      - ./packages/api-client/dist:/app/packages/api-client/dist
      - ./packages/auth/dist:/app/packages/auth/dist
      - ./packages/config/dist:/app/packages/config/dist
      - ./packages/db/dist:/app/packages/db/dist

  relay:
    <<: *go-volumes
    container_name: mesh-relay
    build:
      context: .
      dockerfile: apps/relay/Dockerfile.dev
    ports:
      - "${RELAY_HOST_PORT:-3340}:3340"
    # Also on the isolated lab networks, so lab-c and lab-d can reach it.
    networks: [default, lab_c, lab_d]

  dns:
    <<: *go-volumes
    container_name: mesh-dns
    build:
      context: .
      dockerfile: apps/dns/Dockerfile.dev

  # ---------------------------------------------------------------------------
  # E2E stack (`pnpm e2e:up`): same images, separate mesh_test database and
  # Redis db 1, so tests never touch dev data. Not started by `docker:up`.
  # ---------------------------------------------------------------------------
  api-e2e:
    profiles: [e2e]
    container_name: mesh-api-e2e
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://mesh:mesh@postgres:5432/mesh_test
      - REDIS_URL=redis://redis:6379/1
      - NATS_URL=nats://nats:4222
      - BETTER_AUTH_URL=http://localhost:4200
      - WEB_URL=http://localhost:3200
      - RELAY_URL=ws://relay:3340/relay
      - LOG_LEVEL=warn
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
    ports:
      - "4200:4000"
    networks: [default, lab_c, lab_d]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/auth/dist:/app/packages/auth/dist
      - ./packages/config/dist:/app/packages/config/dist
      - ./packages/db/dist:/app/packages/db/dist
      - ./packages/emails/dist:/app/packages/emails/dist
      - ./packages/server-core/dist:/app/packages/server-core/dist
      - ./packages/utils/dist:/app/packages/utils/dist

  web-e2e:
    profiles: [e2e]
    container_name: mesh-web-e2e
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://mesh:mesh@postgres:5432/mesh_test
      - BETTER_AUTH_URL=http://localhost:4200
      - WEB_URL=http://localhost:3200
      - NEXT_PUBLIC_API_URL=http://localhost:4200
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
    ports:
      - "3200:3000"
    depends_on:
      postgres:
        condition: service_healthy
      api-e2e:
        condition: service_started
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages/ui/src:/app/packages/ui/src
      - ./packages/api-client/dist:/app/packages/api-client/dist
      - ./packages/auth/dist:/app/packages/auth/dist
      - ./packages/config/dist:/app/packages/config/dist
      - ./packages/db/dist:/app/packages/db/dist

  workers-e2e:
    profiles: [e2e]
    container_name: mesh-workers-e2e
    build:
      context: .
      dockerfile: apps/workers/Dockerfile.dev
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/1
      - SMTP_URL=smtp://mailpit:1025
      - LOG_LEVEL=warn
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
    depends_on:
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - ./apps/workers/src:/app/apps/workers/src
      - ./packages/config/dist:/app/packages/config/dist
      - ./packages/db/dist:/app/packages/db/dist
      - ./packages/emails/dist:/app/packages/emails/dist
      - ./packages/server-core/dist:/app/packages/server-core/dist
      - ./packages/utils/dist:/app/packages/utils/dist

  # Browser for the tests. Host networking so it reaches the e2e stack on
  # localhost, where web and API share a site and session cookies work.
  # Keep the version in step with @playwright/test.
  playwright:
    profiles: [e2e]
    container_name: mesh-playwright
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    network_mode: host
    init: true
    ipc: host
    command: ["npx", "-y", "playwright@1.63.0", "run-server", "--port", "3300", "--host", "127.0.0.1"]

  # ---------------------------------------------------------------------------
  # Two-device lab (`pnpm lab`): agents in containers with TUN access, enrolled
  # against the e2e API. Needs the e2e stack (`pnpm e2e:up`).
  # ---------------------------------------------------------------------------
  lab-a: &lab-device
    profiles: [lab]
    container_name: mesh-lab-a
    hostname: lab-a
    build:
      context: .
      dockerfile: apps/agent/Dockerfile.lab
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun

  lab-b:
    <<: *lab-device
    container_name: mesh-lab-b
    hostname: lab-b

  # lab-c and lab-d sit on separate networks: they reach the API and relay but
  # not each other, so they can only connect through the relay.
  lab-c:
    <<: *lab-device
    container_name: mesh-lab-c
    hostname: lab-c
    networks: [lab_c]

  lab-d:
    <<: *lab-device
    container_name: mesh-lab-d
    hostname: lab-d
    networks: [lab_d]

volumes:
  go_mod_cache:
  go_build_cache:

networks:
  lab_c:
  lab_d:
